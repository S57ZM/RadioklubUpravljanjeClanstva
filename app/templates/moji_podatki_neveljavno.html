<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Povezava ni veljavna</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    body {
      background: #111518;
      color: #f1f1f1;
      min-height: 100vh;
    }
    .card {
      background: #202020;
      border: 0;
      border-radius: 20px;
    }
  </style>
</head>

<body>
<div class="container py-5" style="max-width: 560px;">

  <div class="text-center mb-4">
    <div class="fs-2">📡</div>
    <h4 class="mt-2">{{ request.state.klub_oznaka }}</h4>
    <div class="text-secondary">Preverjanje članskih podatkov</div>
  </div>

  <div class="card p-4 text-center text-light">

    <div class="display-5 mb-3">⚠️</div>

    <h3>Povezava ni več veljavna</h3>

    <p class="text-secondary mt-3 mb-2">
      Ta povezava je potekla, je že bila uporabljena
      ali pa je bila ustvarjena novejša povezava.
    </p>

    <p class="text-secondary mb-0">
      Za novo povezavo se obrnite na radioklub.
    </p>

  </div>

</div>
</body>
</html>
