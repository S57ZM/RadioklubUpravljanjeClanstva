<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podatki prejeti</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <meta name="robots" content="noindex,nofollow">

  <style>
    body { background: #f4f6f8; }
    .page { max-width: 600px; margin: 0 auto; }
    .card { border: 0; border-radius: 1rem; box-shadow: 0 .25rem 1rem rgba(0,0,0,.08); }
  </style>
</head>

<body>
<div class="container py-5 page">

  <div class="card">
    <div class="card-body p-4 p-md-5 text-center">

      <i class="bi bi-check-circle-fill text-success"
         style="font-size:4rem"></i>

      <h2 class="mt-3">Hvala, {{ clan.ime }}.</h2>

      {% if podatki_pravilni %}
        <p class="lead mt-3">
          Potrdili ste, da so vaši podatki pravilni.
        </p>
      {% else %}
        <p class="lead mt-3">
          Predlagane spremembe smo prejeli.
        </p>

        <p class="text-secondary">
          Pred vpisom v evidenco jih bo pregledal pooblaščeni član kluba.
        </p>
      {% endif %}

      <div class="alert alert-success mt-4 mb-0">
        <i class="bi bi-shield-check me-1"></i>
        Zahteva je bila uspešno zabeležena.
      </div>

      <p class="text-secondary small mt-4 mb-0">
        To okno lahko zaprete.
      </p>

    </div>
  </div>

</div>
</body>
</html>
